name: 📖 部署统一文档站到 GitHub Pages

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  魔法纪录复兴计划 · 统一文档站 —— VitePress 自动部署                     ║
# ╠════════════════════════════════════════════════════════════════════════╣
# ║  线上地址 https://docs.magireco.top —— 本仓库 Pages 直接绑定自定义域名， ║
# ║  域名由 public/CNAME 声明，链路里没有 Cloudflare Worker。                ║
# ║                                                                        ║
# ║  这正是把两个文档站合并到本仓库的原因：反代 Worker 是单点，一失效两边     ║
# ║  文档同时消失，而文档的目标是「服务器全死也要留下来」。                   ║
# ║                                                                        ║
# ║  首次启用前需在 Settings → Pages 把 Source 设为 "GitHub Actions"，       ║
# ║  并在 Custom domain 填 docs.magireco.top。                              ║
# ╚════════════════════════════════════════════════════════════════════════╝

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；不取消进行中的生产部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastUpdated 需要完整历史才能取到每页的最后提交时间

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run docs:build

      - name: 核对旧链接重定向页是否被带进产物
        # public/ 下的重定向页是旧 URL 不 404 的唯一保障，构建产物里必须原样存在。
        # 少一个就意味着社区里流传的某个链接从此失效，所以这里当作硬失败。
        #
        # 必须按「含 refresh 标记」来数，不能数目录下的 html 总数：dist/client 与
        # dist/server 里同时还有新站自己的内容页，只数总数的话即使重定向页全丢了
        # 也能凑够数，等于没检查。
        run: |
          n=$(grep -rl 'http-equiv="refresh"' .vitepress/dist/client .vitepress/dist/server 2>/dev/null | wc -l)
          echo "重定向页数量：$n（期望 67）"
          if [ "$n" -ne 67 ]; then
            echo "::error::重定向页数量不是 67，旧链接可能 404，拒绝部署"
            grep -rL 'http-equiv="refresh"' .vitepress/dist/client .vitepress/dist/server 2>/dev/null | head -20
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
