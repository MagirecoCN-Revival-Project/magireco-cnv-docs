name: 📖 部署统一文档站到 GitHub Pages

# ╔════════════════════════════════════════════════════════════════════════╗
# ║  魔法纪录复兴计划 · 统一文档站 —— VitePress 自动部署                     ║
# ╠════════════════════════════════════════════════════════════════════════╣
# ║  线上地址 https://docs.magireco.top —— 本仓库 Pages 直接绑定自定义域名， ║
# ║  域名由 public/CNAME 声明，链路里没有 Cloudflare Worker。                ║
# ║                                                                        ║
# ║  这正是把两个文档站合并到本仓库的原因：反代 Worker 是单点，一失效两边     ║
# ║  文档同时消失，而文档的目标是「服务器全死也要留下来」。                   ║
# ║                                                                        ║
# ║  首次启用前需在 Settings → Pages 把 Source 设为 "GitHub Actions"，       ║
# ║  并在 Custom domain 填 docs.magireco.top。                              ║
# ╚════════════════════════════════════════════════════════════════════════╝

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；不取消进行中的生产部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastUpdated 需要完整历史才能取到每页的最后提交时间

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run docs:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
